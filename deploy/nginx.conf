# Travel Umrah — Nginx Configuration
# Copy ke: /etc/nginx/sites-available/travelumrah
# Sesuaikan `server_name` dengan domain production Anda.

limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;

server {
    listen 80;
    listen [::]:80;

    server_name travelumrah.whitelabel.co.id;
    root /var/www/travelumrah/public;
    server_tokens off;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()";
    # Aktifkan HSTS setelah HTTPS aktif:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    index index.php index.html;
    charset utf-8;

    # ============================================================
    # Logging
    # ============================================================
    access_log /var/log/nginx/travelumrah-access.log;
    error_log  /var/log/nginx/travelumrah-error.log;

    # ============================================================
    # Security — block hidden files & sensitive paths
    # ============================================================
    location ~ /\.(?!well-known).* {
        deny all;
        return 404;
    }

    location ~* (\.env|composer\.(json|lock)|package\.json|package-lock\.json|\.git|\.license\.lock) {
        deny all;
        return 404;
    }

    location ~* ^/storage/logs/ {
        deny all;
        return 404;
    }

    # ============================================================
    # Static Assets — cache headers
    # ============================================================
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri $uri/ =404;
    }

    location ~* \.(css|js|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri $uri/ =404;
    }

    # Build assets (Vite hashed filenames)
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ============================================================
    # Gzip Compression
    # ============================================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        text/markdown
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        application/rss+xml
        application/x-javascript
        application/x-font-ttf
        application/x-font-opentype
        image/svg+xml
        font/opentype
        font/ttf
        font/eot
        font/woff
        font/woff2;

    # ============================================================
    # Rate limit — brute force & spam lead
    # ============================================================
    location = /portal/login {
        limit_req zone=login burst=5 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }
    location ~ ^/api/ {
        limit_req zone=api burst=20 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }
    location ~ ^/payment/ {
        limit_req zone=api burst=20 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ============================================================
    # Primary Location — Laravel Front Controller
    # ============================================================
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ============================================================
    # PHP-FPM
    # ============================================================
    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        fastcgi_read_timeout 300;

        # Security: prevent executing PHP in upload directories
        fastcgi_param PATH_INFO $fastcgi_path_info;

        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    # ============================================================
    # Deny access to PHP files in sensitive directories
    # ============================================================
    location ~* ^/(storage|vendor|database|bootstrap)/.*\.php$ {
        deny all;
        return 404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # ============================================================
    # Maximum upload size (sesuaikan)
    # ============================================================
    client_max_body_size 20M;
}


; =============================================================================
; Travel Umrah — Supervisor Configuration
; Copy ke: /etc/supervisor/conf.d/travelumrah.conf
; Sesuaikan path & user (ganti `www-data` dengan user web server Anda)
; =============================================================================

; --- Queue Worker (default queue) ---
[program:travelumrah-queue-default]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/travelumrah/artisan queue:work --queue=default --tries=3 --max-time=3600 --max-jobs=1000 --rest=1 --sleep=3
directory=/var/www/travelumrah
autostart=true
autorestart=true
stopwaitsecs=30
stopasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/travelumrah/storage/logs/worker-default.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5

; --- Queue Worker (broadcasts queue) ---
[program:travelumrah-queue-broadcasts]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/travelumrah/artisan queue:work --queue=default --tries=3 --max-time=3600 --max-jobs=500 --rest=1 --sleep=5
directory=/var/www/travelumrah
autostart=true
autorestart=true
stopwaitsecs=30
stopasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/travelumrah/storage/logs/worker-broadcasts.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5

; --- Laravel Scheduler (schedule:work — persistent) ---
; NONAKTIF default: gunakan cron (lihat DEPLOYMENT.md). Aktifkan hanya jika TIDAK pakai cron.
; [program:travelumrah-scheduler]
; process_name=%(program_name)s_%(process_num)02d
; command=php /var/www/travelumrah/artisan schedule:work
; directory=/var/www/travelumrah
; autostart=false
; autorestart=false
; stopwaitsecs=30
; stopasgroup=true
; user=www-data
; numprocs=1
; redirect_stderr=true
; stdout_logfile=/var/www/travelumrah/storage/logs/scheduler.log
; stdout_logfile_maxbytes=10MB
; stdout_logfile_backups=5

; =============================================================================
; Setup Instructions:
;
; 1. Copy file ini ke /etc/supervisor/conf.d/travelumrah.conf
; 2. Sesuaikan `user` dengan user web server (biasanya `www-data` atau `nginx`)
; 3. Sesuaikan path jika aplikasi tidak di `/var/www/travelumrah`
; 4. Jalankan:
;    sudo supervisorctl reread
;    sudo supervisorctl update
;    sudo supervisorctl status travelumrah-queue:*
;    sudo supervisorctl status travelumrah-scheduler:*
;
; 5. Untuk monitoring:
;    sudo supervisorctl tail -f travelumrah-queue-default
;
; Perhatian: Pilih antara supervisor scheduler ATAU cron scheduler — jangan
; keduanya sekaligus! Jika memakai supervisor scheduler, comment/disable cron.
; =============================================================================
